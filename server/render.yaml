services:
  - type: web
    name: consultpro-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false        # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false        # set manually in Render dashboard (your Vercel URL)
      - key: ADMIN_TOKEN
        generateValue: true  # Render auto-generates a secure random value
